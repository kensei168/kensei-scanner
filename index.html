<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0">

  <title>Scanner Presensi LPK Kensei</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .card {
      max-width: 450px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
      text-align: center;
    }

    .brand {
      font-size: 13px;
      letter-spacing: 2px;
      color: #888;
      margin-bottom: 5px;
    }

    h1 {
      color: #A52424;
      margin: 8px 0 5px;
    }

    .desc {
      color: #777;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      margin-bottom: 10px;
    }

    input:focus {
      border-color: #A52424;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #loginBtn,
    #startBtn {
      background: #A52424;
      color: white;
    }

    #stopBtn,
    #logoutBtn {
      background: #eee;
      color: #444;
      margin-top: 10px;
    }

    #stopBtn {
      display: none;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 15px;
      margin-top: 15px;
      background: #111;
    }

    #reader video {
      object-fit: cover !important;
    }

    #status,
    #loginStatus {
      margin-top: 18px;
      padding: 15px;
      border-radius: 12px;
      background: #f5f5f5;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      background: #e8f7ed !important;
      color: #14702d;
    }

    .error {
      background: #ffecec !important;
      color: #a40000;
    }

    .loading {
      background: #fff7df !important;
      color: #755500;
    }

    .hasil {
      font-size: 22px;
      font-weight: bold;
      margin-top: 7px;
      letter-spacing: 1px;
    }

    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: #aaa;
      line-height: 1.5;
    }

    #scannerPage {
      display: none;
    }
  </style>
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="card">

  <div class="brand">
    LPK KENSEI アカデミー
  </div>

  <h1>🔐 Kensei Scanner</h1>

  <div class="desc">
    Masukkan password untuk membuka scanner presensi.
  </div>

  <input
    type="password"
    id="password"
    placeholder="Masukkan password"
    onkeydown="if(event.key==='Enter') login()"
  >

  <button id="loginBtn" onclick="login()">
    MASUK
  </button>

  <div id="loginStatus">
    Silakan login.
  </div>

</div>


<!-- SCANNER PAGE -->
<div id="scannerPage" class="card">

  <div class="brand">
    LPK KENSEI アカデミー
  </div>

  <h1>Scanner Presensi</h1>

  <div class="desc">
    Arahkan kamera ke barcode atau QR Code siswa.
  </div>

  <button id="startBtn" onclick="mulaiKamera()">
    📷 Aktifkan Kamera
  </button>

  <button id="stopBtn" onclick="stopKamera()">
    ⏹ Tutup Kamera
  </button>

  <div id="reader"></div>

  <div id="status">
    Kamera belum diaktifkan.
  </div>

  <button id="logoutBtn" onclick="logout()">
    🚪 Logout
  </button>

  <div class="footer">
    LPK Kensei アカデミー<br>
    Sistem Presensi Siswa
  </div>

</div>


<script>

// ======================================
// KONFIGURASI PASSWORD
// ======================================

const PASSWORD_SCANNER = "kensei2026";

// login aktif selama 8 jam
const LOGIN_DURATION = 8 * 60 * 60 * 1000;


// ======================================
// LOGIN
// ======================================

function login() {

  const input =
    document.getElementById("password");

  const loginStatus =
    document.getElementById("loginStatus");

  const password =
    input.value.trim();

  if (password === PASSWORD_SCANNER) {

    const expired =
      Date.now() + LOGIN_DURATION;

    localStorage.setItem(
      "kenseiScannerLogin",
      expired
    );

    bukaScanner();

  } else {

    loginStatus.className =
      "error";

    loginStatus.innerHTML =
      "❌ Password salah.";

    input.value = "";

    input.focus();
  }
}


// ======================================
// CEK LOGIN
// ======================================

function cekLogin() {

  const expired =
    Number(
      localStorage.getItem(
        "kenseiScannerLogin"
      )
    );

  if (
    expired &&
    Date.now() < expired
  ) {

    bukaScanner();

  } else {

    localStorage.removeItem(
      "kenseiScannerLogin"
    );
  }
}


// ======================================
// BUKA SCANNER
// ======================================

function bukaScanner() {

  document
    .getElementById("loginPage")
    .style.display =
    "none";

  document
    .getElementById("scannerPage")
    .style.display =
    "block";
}


// ======================================
// LOGOUT
// ======================================

async function logout() {

  await stopKamera();

  localStorage.removeItem(
    "kenseiScannerLogin"
  );

  document
    .getElementById("scannerPage")
    .style.display =
    "none";

  document
    .getElementById("loginPage")
    .style.display =
    "block";

  document
    .getElementById("password")
    .value =
    "";

  document
    .getElementById("loginStatus")
    .className =
    "";

  document
    .getElementById("loginStatus")
    .innerHTML =
    "Silakan login.";
}


// ======================================
// SCANNER
// ======================================

let scanner = null;
let aktif = false;

let terakhirScan = "";
let waktuScanTerakhir = 0;


// ======================================
// MULAI KAMERA
// ======================================

async function mulaiKamera() {

  const status =
    document.getElementById("status");

  const startBtn =
    document.getElementById("startBtn");

  const stopBtn =
    document.getElementById("stopBtn");

  status.className =
    "loading";

  status.innerHTML =
    "⏳ Meminta izin kamera...";

  try {

    scanner =
      new Html5Qrcode("reader");

    await scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: function(width, height) {

          const ukuran =
            Math.floor(
              Math.min(
                width,
                height
              ) * 0.72
            );

          return {
            width: ukuran,
            height: ukuran
          };
        }
      },

      function(decodedText) {

        prosesScan(decodedText);

      },

      function(errorMessage) {
        // diabaikan
      }
    );

    aktif = true;

    startBtn.style.display =
      "none";

    stopBtn.style.display =
      "block";

    status.className =
      "";

    status.innerHTML =
      "📷 Kamera aktif.<br>" +
      "Arahkan kode ke dalam kotak.";

  }

  catch(error) {

    console.error(error);

    status.className =
      "error";

    status.innerHTML =
      "❌ Kamera gagal dibuka.<br><br>" +
      aman(
        error.message ||
        String(error)
      );
  }
}


// ======================================
// PROSES HASIL SCAN
// ======================================

function prosesScan(decodedText) {

  decodedText =
    String(decodedText || "")
    .trim();

  if (!decodedText) {
    return;
  }

  const sekarang =
    Date.now();

  if (
    decodedText === terakhirScan &&
    sekarang - waktuScanTerakhir < 3000
  ) {
    return;
  }

  terakhirScan =
    decodedText;

  waktuScanTerakhir =
    sekarang;

  const status =
    document.getElementById("status");

  status.className =
    "success";

  status.innerHTML =
    "✅ BARCODE TERBACA" +
    "<div class='hasil'>" +
    aman(decodedText) +
    "</div>";

  bunyiBeep();

  setTimeout(function() {

    status.className =
      "";

    status.innerHTML =
      "📷 Siap scan siswa berikutnya...";

  }, 1500);
}


// ======================================
// STOP KAMERA
// ======================================

async function stopKamera() {

  if (
    scanner &&
    aktif
  ) {

    try {

      await scanner.stop();

      scanner.clear();

    }

    catch(e) {
      console.log(e);
    }
  }

  aktif = false;
  scanner = null;

  document
    .getElementById("startBtn")
    .style.display =
    "block";

  document
    .getElementById("stopBtn")
    .style.display =
    "none";

  document
    .getElementById("status")
    .innerHTML =
    "Kamera ditutup.";
}


// ======================================
// BUNYI BEEP
// ======================================

function bunyiBeep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const audioCtx =
      new AudioContext();

    const oscillator =
      audioCtx.createOscillator();

    const gain =
      audioCtx.createGain();

    oscillator.connect(gain);

    gain.connect(
      audioCtx.destination
    );

    oscillator.frequency.value =
      900;

    gain.gain.value =
      0.08;

    oscillator.start();

    setTimeout(function() {

      oscillator.stop();

      audioCtx.close();

    }, 120);

  }

  catch(e) {
    console.log(e);
  }
}


// ======================================
// SECURITY TEXT
// ======================================

function aman(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;
}


// ======================================
// CEK LOGIN SAAT HALAMAN DIBUKA
// ======================================

window.addEventListener(
  "load",
  cekLogin
);

</script>

</body>
</html>
